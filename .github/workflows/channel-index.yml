name: Verify Mojara 1.2.8 Conda channel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/channel-index.yml
      - scripts/release/publish-conda-channel.sh
      - docs/CHANNEL-PUBLISH.md
  pull_request:
    paths:
      - .github/workflows/channel-index.yml
      - scripts/release/publish-conda-channel.sh
      - docs/CHANNEL-PUBLISH.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conda-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify published Conda indexes
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base='https://mojara.kasua.ng/conda'
          for platform in ('linux-64','linux-aarch64','osx-arm64'):
              request=urllib.request.Request(
                  f'{base}/{platform}/repodata.json',
                  headers={'User-Agent':'Mojara-Channel-Qualification'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  index=json.load(response)
              found=[name for name,info in index.get('packages.conda',{}).items()
                     if info.get('name')=='mojara' and info.get('version')=='1.2.8']
              assert len(found)==1,(platform,found)
              print('PASS:',platform,found[0])
          PY
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: false
      - name: Test public installation by name
        run: |
          pixi global install 'mojara==1.2.8' \
            -c https://mojara.kasua.ng/conda/ \
            -c https://conda.modular.com/max/ \
            -c conda-forge
          mojara version
          mojara doctor
