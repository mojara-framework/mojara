name: Verify public Mojara Conda channel installations

on:
  pull_request:
    paths:
      - '.github/workflows/channel-install.yml'
      - 'README.md'
      - 'docs/INSTALL-LINUX.md'
      - 'docs/INSTALL-MACOS.md'
      - 'docs/CROSS-PLATFORM.md'
      - 'docs/CHANNEL-PUBLISH.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/channel-install.yml'
      - 'README.md'
      - 'docs/INSTALL-LINUX.md'
      - 'docs/INSTALL-MACOS.md'
      - 'docs/CROSS-PLATFORM.md'
      - 'docs/CHANNEL-PUBLISH.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    name: Install Mojara from public channel / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: osx-arm64
            runner: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: false
      - name: Install Mojara 1.2.8 by name from official public channel
        run: |
          set -Eeuo pipefail
          export PIXI_HOME="$RUNNER_TEMP/mojara-public-pixi"
          pixi global install 'mojara==1.2.8' \
            -c https://mojara.kasua.ng/conda/ \
            -c https://conda.modular.com/max/ \
            -c conda-forge
          "$PIXI_HOME/bin/mojara" version
          "$PIXI_HOME/bin/mojara" doctor
      - name: Build and run installed Mojara application
        run: |
          set -Eeuo pipefail
          export PIXI_HOME="$RUNNER_TEMP/mojara-public-pixi"
          CLI="$PIXI_HOME/bin/mojara"
          "$CLI" new public-install
          cd public-install
          "$CLI" build
          test -x build/app
          MOJARA_HOST=127.0.0.1 MOJARA_PORT=18888 "$CLI" start --local > "$RUNNER_TEMP/mojara-public.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 1 http://127.0.0.1:18888/health > "$RUNNER_TEMP/mojara-public.json"; then
              python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/mojara-public.json")); assert d == {"status":"ok","framework":"Mojara"},d'
              echo "PASS: Public channel installed Mojara and served HTTP"
              exit 0
            fi
            sleep 1
          done
          tail -100 "$RUNNER_TEMP/mojara-public.log" >&2
          exit 1
