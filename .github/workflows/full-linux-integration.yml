name: Full Linux framework integration

on:
  push:
    paths:
      - 'source/**'
      - 'scripts/ci/**'
      - 'tests/integration/**'
      - 'scripts/build-cli.sh'
      - 'pixi.toml'
      - '.github/workflows/full-linux-integration.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'scripts/ci/**'
      - 'scripts/build-cli.sh'
      - 'pixi.toml'
      - '.github/workflows/full-linux-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojara-full-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-framework:
    name: Native SDK and HTTP server / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mojara
          POSTGRES_PASSWORD: mojara_ci
          POSTGRES_DB: mojara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mojara -d mojara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: mojara
          MARIADB_USER: mojara
          MARIADB_PASSWORD: mojara_ci
          MARIADB_ROOT_PASSWORD: mojara_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - name: Checkout full first-party source
        uses: actions/checkout@v4
      - name: Install native C/C++ development dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates zstd \
            libssl-dev zlib1g-dev libdeflate-dev libbrotli-dev \
            libsqlite3-dev libpq-dev libmariadb-dev libsodium-dev
      - name: Install Mojo 1.2.0 and pinned JSON build dependency
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: false
      - name: Fetch SHA256-pinned third-party Mojo SOURCE, not x86 binaries
        run: bash scripts/ci/bootstrap-source.sh
      - name: Compile all core native libraries, CLI and framework for host CPU
        run: pixi run bash scripts/ci/build-source-sdk.sh
      - name: Build and run a real Mojo web application
        run: pixi run bash scripts/ci/test-http-app.sh
      - name: Test real PostgreSQL and MariaDB prepared queries and transactions
        env:
          MOJARA_CI_PG_DSN: "host=127.0.0.1 port=5432 user=mojara password=mojara_ci dbname=mojara"
          MOJARA_CI_MYSQL_HOST: "127.0.0.1"
          MOJARA_CI_MYSQL_PASSWORD: "mojara_ci"
        run: pixi run bash scripts/ci/test-databases.sh
      - name: Verify signed sessions, uploads, WebSockets and concurrent traffic
        run: pixi run bash scripts/ci/test-http-features.sh
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-logs-${{ matrix.target }}
          path: |
            build/full-integration/server.log
            build/full-integration/health.json
            build/full-integration/http-features/server.log
          if-no-files-found: ignore
