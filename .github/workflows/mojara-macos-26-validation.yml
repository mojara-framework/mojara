name: macOS Apple Silicon framework validation

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'packaging/macos/**'
      - 'pixi.toml'
      - '.github/workflows/mojara-macos-26-validation.yml'
      - '.github/workflows/release-macos.yml'
      - '.github/workflows/release-linux.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'scripts/ci/bootstrap-source.sh'
      - 'scripts/ci/build-macos-sdk.sh'
      - 'scripts/build-cli.sh'
      - 'scripts/ci/prepare-macos-payload.sh'
      - 'scripts/ci/build-macos-package.sh'
      - 'scripts/ci/install-macos-package.sh'
      - 'packaging/macos/**'
      - 'pixi.toml'
      - '.github/workflows/mojara-macos-26-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojara-macos26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-framework:
    name: Native Mojara / macOS arm64
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.9
      - name: Verify release source matches the immutable v1.2.9 tag
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$(git rev-parse HEAD)"
          tagged="$(git ls-remote origin refs/tags/v1.2.9 | awk '{print $1}')"
          test -n "$tagged" && test "$current" = "$tagged"
          echo "Building exact release source $current"
      - name: Confirm Apple Silicon host
        run: |
          test "$(uname -sm)" = "Darwin arm64"
          xcrun --find clang
      - name: Install native Mojo and Conda libraries
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: false
      - name: Recover checksum-verified upstream Mojo source
        run: pixi run bash scripts/ci/bootstrap-source.sh
      - name: Compile Mach-O native bridges, Mojo framework and CLI
        run: pixi run bash scripts/ci/build-macos-sdk.sh
      - name: Build a generated macOS application
        run: |
          set -Eeuo pipefail
          export MOJARA_HOME="$GITHUB_WORKSPACE/build/full-integration/sdk"
          export DYLD_LIBRARY_PATH="$MOJARA_HOME/lib:$GITHUB_WORKSPACE/.pixi/envs/default/lib:${DYLD_LIBRARY_PATH:-}"
          export PATH="$GITHUB_WORKSPACE/.pixi/envs/default/bin:$PATH"
          "$MOJARA_HOME/bin/mojara" new hello-mac
          test -f hello-mac/app.mojo
          test -f hello-mac/mojara.project
          test ! -e hello-mac/pixi.toml
          cd hello-mac
          "$MOJARA_HOME/bin/mojara" build
          test -x build/app
      - name: Verify HTTP health from real Mojo server
        run: |
          set -Eeuo pipefail
          export MOJARA_HOME="$GITHUB_WORKSPACE/build/full-integration/sdk"
          export DYLD_LIBRARY_PATH="$MOJARA_HOME/lib:$GITHUB_WORKSPACE/.pixi/envs/default/lib:${DYLD_LIBRARY_PATH:-}"
          export PATH="$GITHUB_WORKSPACE/.pixi/envs/default/bin:$PATH"
          cd hello-mac
          MOJARA_HOST=127.0.0.1 MOJARA_PORT=18881 "$MOJARA_HOME/bin/mojara" start --local > ../build/macos-app.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 1 http://127.0.0.1:18881/health -o ../build/macos-health.json; then
              python3 -c 'import json; d=json.load(open("../build/macos-health.json")); assert d == {"status":"ok","framework":"Mojara"},d'
              echo "PASS: Mojara served HTTP on Apple Silicon"
              exit 0
            fi
            sleep 1
          done
          tail -100 ../build/macos-app.log
          exit 1
      - name: Build unpublished Apple Silicon Conda package
        run: pixi run bash scripts/ci/build-macos-package.sh
      - name: Upload native macOS package for independent installation
        uses: actions/upload-artifact@v4
        with:
          name: mojara-osx-arm64-candidate
          path: build/full-integration/macos-packages/**/*.conda
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-native-integration-diagnostics
          path: |
            build/macos-app.log
            build/macos-health.json
          if-no-files-found: ignore

  clean-install:
    name: Fresh native Mojara package / osx-arm64
    needs: macos-framework
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.9
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mojara-osx-arm64-candidate
          path: build/macos-package-download
      - name: Install Mojara native package and run HTTP app from fresh environment
        run: bash scripts/ci/install-macos-package.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-fresh-install-diagnostics
          path: |
            build/macos-fresh-install/server.log
            build/macos-fresh-install/health.json
          if-no-files-found: ignore
