name: macOS Apple Silicon validation (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-cli:
    name: Mojara CLI / osx-arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi and Mojo 1.2.0
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: false
      - name: Verify macOS and Mojo
        run: pixi run bash scripts/verify-platform.sh
      - name: Compile CLI natively on Apple Silicon
        run: pixi run bash scripts/build-cli.sh
      - name: Verify project creation
        run: |
          ./build/bin/mojara new hello-mac
          test -f hello-mac/app.mojo
          test -f hello-mac/mojara.project
          ! test -e hello-mac/pixi.toml
          echo "macOS CLI smoke test passed."
