name: Native bridge regressions

on:
  push:
    paths:
      - 'source/native/**'
      - 'tests/native/**'
      - 'scripts/test-native.sh'
      - '.github/workflows/native-bridge-regressions.yml'
  pull_request:
    paths:
      - 'source/native/**'
      - 'tests/native/**'
      - 'scripts/test-native.sh'
      - '.github/workflows/native-bridge-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    name: C bridge regression / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run native bridge tests
        run: bash scripts/test-native.sh
