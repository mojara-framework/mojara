name: Publish Mojara Docker image

on:
  push:
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - '.github/workflows/publish-docker.yml'
  workflow_run:
    workflows:
      - Publish native Mojara Linux packages
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

env:
  DOCKER_VERSION: "1.2.9"
  IMAGE: ghcr.io/mojara-framework/mojara

jobs:
  image:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and test Docker / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: linux-64
            package: mojara-1.2.9-hb0f4dca_0.conda
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: linux-aarch64
            package: mojara-1.2.9-he8cfe8b_0.conda
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify qualified native 1.2.9 package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p packaging/docker/package
          base="https://github.com/${{ github.repository }}/releases/download/v$DOCKER_VERSION"
          curl -fsSL --retry 3 "$base/SHA256SUMS" -o /tmp/mojara-release-sums
          name="${{ matrix.package }}"
          expected="$(awk -v file="$name" '$2 == file {print $1}' /tmp/mojara-release-sums)"
          test -n "$expected"
          curl -fsSL --retry 3 "$base/$name" -o "packaging/docker/package/$name"
          printf '%s  %s\n' "$expected" "packaging/docker/package/$name" | sha256sum -c -
      - name: Build official runtime and development image
        run: |
          docker build --platform linux/${{ matrix.arch }} \
            --build-arg "MOJARA_VERSION=$DOCKER_VERSION" \
            --build-arg MOJARA_PACKAGE_MODE=local \
            -t "$IMAGE:$DOCKER_VERSION-${{ matrix.arch }}" \
            -f packaging/docker/Dockerfile .
      - name: Run real generated Mojo application in Docker
        run: |
          bash scripts/ci/test-docker-image.sh \
            "$IMAGE:$DOCKER_VERSION-${{ matrix.arch }}" \
            "linux/${{ matrix.arch }}"
      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture image
        run: docker push "$IMAGE:$DOCKER_VERSION-${{ matrix.arch }}"

  manifest:
    name: Publish Docker multiarchitecture manifest
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest tags for both architectures
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$DOCKER_VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE:$DOCKER_VERSION-amd64" \
            "$IMAGE:$DOCKER_VERSION-arm64"
      - name: Verify manifest architectures
        run: |
          docker buildx imagetools inspect "$IMAGE:$DOCKER_VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"
