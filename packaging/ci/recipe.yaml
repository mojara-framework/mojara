context:
  version: "1.2.5"

package:
  name: mojara-ci-smoke
  version: ${{ version }}

source:
  path: ../../build/full-integration/package-payload
  use_gitignore: false

build:
  number: 0
  string: source_native_0
  script: bash ${{ RECIPE_DIR }}/build.sh

requirements:
  host:
    - libpq
    - mariadb-connector-c
    - openssl >=3
    - sqlite
    - zlib
    - libdeflate
    - brotli
    - libsodium
    - simdjson >=4,<5
    - libgcc-ng
    - libstdcxx-ng
  run:
    - mojo ==1.2.0
    - watchexec >=2.7,<3
    - libpq
    - mariadb-connector-c
    - openssl >=3
    - sqlite
    - zlib
    - libdeflate
    - brotli
    - libsodium
    - simdjson >=4,<5
    - libgcc-ng
    - libstdcxx-ng

tests:
  - script:
      - mojara version
      - mojara doctor

about:
  homepage: https://mojara.kasua.ng
  summary: Native Mojara integration candidate for isolated CI smoke verification (not a production release)
  license: MIT
  license_file: mojara/LICENSE
