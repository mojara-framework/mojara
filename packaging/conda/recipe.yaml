context:
  version: "1.2.9"

package:
  name: mojara
  version: ${{ version }}

source:
  path: ../../build/full-integration/package-payload
  use_gitignore: false

build:
  number: 0
  script: bash ${{ RECIPE_DIR }}/build.sh

requirements:
  host:
    - mojo ==1.2.0
    - libpq
    - mariadb-connector-c
    - openssl >=3
    - sqlite
    - zlib
    - libdeflate
    - brotli
    - libsodium
    - simdjson >=4,<5
    - libgcc-ng
    - libstdcxx-ng
  run:
    - mojo ==1.2.0
    - watchexec >=2.7,<3
    - libpq
    - mariadb-connector-c
    - openssl >=3
    - sqlite
    - zlib
    - libdeflate
    - brotli
    - libsodium
    - simdjson >=4,<5
    - libgcc-ng
    - libstdcxx-ng

tests:
  - script:
      - mojara version
      - mojara doctor

about:
  homepage: https://mojara.kasua.ng
  documentation: https://mojara.kasua.ng/docs/
  summary: Native Mojo web framework SDK and developer command-line tool
  description: |
    Mojara for Mojo 1.2.0. Includes the precompiled Mojara
    native Mojo framework with asynchronous database jobs, MySQL/PostgreSQL/SQLite schema migrations, and the Flare HTTP reactor.
  license: MIT
  license_file: mojara/LICENSE
