context:
  version: "1.2.9"

package:
  name: mojara
  version: ${{ version }}

source:
  path: ../../build/full-integration/package-payload
  use_gitignore: false

build:
  number: 0
  script: bash ${{ RECIPE_DIR }}/build.sh

requirements:
  host:
    - libpq
    - mariadb-connector-c
    - openssl >=3
    - sqlite
    - zlib
    - libdeflate
    - brotli
    - libsodium
    - simdjson >=4,<5
  run:
    - mojo ==1.2.0
    - watchexec >=2.7,<3
    - libpq
    - mariadb-connector-c
    - openssl >=3
    - sqlite
    - zlib
    - libdeflate
    - brotli
    - libsodium
    - simdjson >=4,<5

tests:
  - script:
      - mojara version
      - mojara doctor

about:
  homepage: https://mojara.kasua.ng
  documentation: https://mojara.kasua.ng/docs/
  summary: Native Mojo web framework and CLI for macOS Apple Silicon
  license: MIT
  license_file: mojara/LICENSE
