# Source-development environment only. Mojara applications need no pixi.toml.
[workspace]
name = "mojara-portability"
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
mojo = "==1.2.0"
watchexec = ">=2.7,<3"
# Required to compile the published JSON Mojo FFI wrapper from source.
simdjson = ">=4.6.0,<5"
